services:
  - type: web
    name: royaa-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DEFAULT_LANGUAGE
        value: ar
      - key: SUPPORTED_LANGUAGES
        value: ar,en
      - key: DEFAULT_CURRENCY
        value: YER
